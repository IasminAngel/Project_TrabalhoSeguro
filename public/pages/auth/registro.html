<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/public/src/pages/login/style_cadastro.css" />
    <link rel="stylesheet" href="/public/src/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="icon"
      href="/public/src/assets/icons/box-arrow-in-right.svg"
      type="image/svg+xml"
    />
    <title>Cadastro</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <img src="/public/src/assets/imgs/info.svg" alt="Info image" />
      </div>
      <div class="form">
        <form action="#" id="cadastroForm">
          <div class="form-header">
            <div class="title">
              <h1>Cadastre-se</h1>
            </div>
            <div class="login-button">
              <button>
                <a href="/public/src/pages/login/login.html">Entrar</a>
              </button>
            </div>
          </div>

          <div class="input-group">
            <div class="input-box">
              <label for="firstname">Primeiro Nome</label>
              <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Digite seu primeiro nome"
                required
              />
            </div>

            <div class="input-box">
              <label for="lastname">Sobrenome</label>
              <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Digite seu segundo nome"
                required
              />
            </div>

            <div class="input-box">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="input-box">
              <label for="number">Celular</label>
              <input
                type="tel"
                id="number"
                name="number"
                placeholder="(xx) xxxx-xxxx"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                required
              />
            </div>

            <div class="input-box">
              <label for="confirmpassword">Confirmar Senha</label>
              <input
                type="password"
                id="confirmpassword"
                name="confirmpassword"
                placeholder="Confirme sua senha"
                required
              />
            </div>
          </div>

          <div class="gender-inputs">
            <div class="gender-title">
              <h6>Gênero</h6>
            </div>
            <div class="gender-group">
              <div class="gender-input">
                <input type="radio" id="female" name="gender" required />
                <label for="female">Feminino</label>
              </div>
              <div class="gender-input">
                <input type="radio" id="male" name="gender" />
                <label for="male">Masculino</label>
              </div>
              <div class="gender-input">
                <input type="radio" id="others" name="gender" />
                <label for="others">Outros</label>
              </div>
              <div class="gender-input">
                <input type="radio" id="none" name="gender" />
                <label for="none">Prefiro não dizer</label>
              </div>
            </div>
          </div>

          <div class="continue-button">
            <button type="button" id="continue">Continuar</button>
          </div>

          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>

    <div id="popup" class="popup" style="display: none">
      <div class="popup-content">
        <span id="closeBtn" class="close">&times;</span>
        <p id="popup-message"></p>
      </div>
    </div>

    <script src="/public/src/services/script_cadastro.js"></script>
  </body>
</html>
