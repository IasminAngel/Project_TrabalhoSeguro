<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/public/src/pages/login/style_login.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="icon"
      href="/public/src/assets/icons/box-arrow-in-left.svg"
      type="image/svg+xml"
    />
    <title>Login</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <img src="/public/src/assets/imgs/Logotipo_TS_2.png" alt="Blog image" />
      </div>
      <div class="form">
        <form id="loginForm">
          <div class="form-header">
            <div class="title">
              <h1>Login</h1>
            </div>
            <div class="login-button">
              <button>
                <a href="/public/src/pages/login/registro.html">Cadastre-se</a>
              </button>
            </div>
          </div>

          <div class="input-group">
            <div class="input-box">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                required
              />
            </div>
          </div>

          <div class="esqueceu-senha">
            <button>
              <a href="/public/src/pages/login/esqueceu_senha.html">Esqueceu a senha ?</a>
            </button>
          </div>

          <div class="continue-button">
            <button type="submit" id="entrar">Entrar</button>
          </div>
          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>
    <script src="/public/src/services/script_login.js"></script>
  </body>
</html>
