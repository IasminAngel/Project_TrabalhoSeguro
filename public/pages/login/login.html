<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/scripts/paths.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    
    <script>
      document.write(frontendPaths.css("login"));
      document.write(
        `<link rel="icon" href="${frontendPaths.icon(
          "entry"
        )}" type="image/svg+xml">`
      );
    </script>
    
    <script>
      document.write(frontendPaths.js("login"));
    </script>

    <title>Login</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <script>
          document.write(
            `<img src="${frontendPaths.img(
              "logos",
              "alternative"
            )}" alt="Logotipo">`
          );
        </script>
      </div>
      <div class="form">
        <form id="loginForm">
          <div class="form-header">
            <div class="title">
              <h1>Login</h1>
            </div>
          </div>

          <div class="input-group">
            <div class="input-box">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                required
              />
            </div>
          </div>

          <div class="esqueceu-senha">
            <button>
              <a onclick="window.location.href= '/senha'">Esqueceu a senha ?</a>
            </button>
          </div>

          <div class="continue-button">
            <button type="submit" id="entrar">Entrar</button>
          </div>
          
          <div class="login-button" style="margin-top: 15px">
            <button>
              <a onclick="window.location.href= '/acidente_incidente'">Cadastre-se</a>
            </button>
          </div>

          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>
  </body>
</html>
