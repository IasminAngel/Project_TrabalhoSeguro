<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/scripts/paths.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <script>
      document.write(frontendPaths.css("senha"));
      document.write(
        `<link rel="icon" href="${frontendPaths.icon(
          "key"
        )}" type="image/svg+xml">`
      );
    </script>
    <title>Esqueceu a senha</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <img src="/assets/imgs/password.svg" alt="Password image" />
      </div>
      <div class="form">
        <form id="passwordForm">
          <div class="form-header">
            <div class="title">
              <h1>Esqueceu a Senha</h1>
            </div>
            <div class="login-button">
              <button type="button">
                <a onclick="window.location.href= '/login'">Entrar</a>
              </button>
            </div>
          </div>
          
          <div class="input-group">
            <div class="input-box">
              <label for="email">E-mail</label>
              <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              required
              />
            </div>
            
            <div class="input-box">
              <label for="password">Nova Senha</label>
              <input
              type="password"
              id="password"
              name="password"
              placeholder="Digite sua nova senha"
              required
              />
            </div>
            
            <div class="input-box">
              <label for="confirmPassword">Confirmar Senha</label>
              <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirme sua nova senha"
              required
              />
            </div>
          </div>
          
          <div class="continue-button">
            <button type="button" id="confirm">Confirmar</button>
          </div>
          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>
    <script>
      document.write(frontendPaths.js("senha"));
    </script>
  </body>
  </html>
