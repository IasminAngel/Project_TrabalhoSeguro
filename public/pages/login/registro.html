<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/scripts/paths.js"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script>
      document.write(frontendPaths.css("registro"));
      document.write(
        `<link rel="icon" href="${frontendPaths.icon(
          "create"
        )}" type="image/svg+xml">`
      );
    </script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script>
      document.write(frontendPaths.js("registro"));
      document.write(frontendPaths.js("shows"));
    </script>
    <title>Cadastro</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <img src="/assets/imgs/info.svg" alt="Info image" />
      </div>
      <div class="form">
        <form id="cadastroForm">
          <div class="form-header">
            <div class="title">
              <h1>Cadastre-se</h1>
            </div>
            <div class="login-button">
              <button type="button">
                <a onclick="window.location.href= '/login'">Entrar</a>
              </button>
            </div>
          </div>

          <div class="input-group">
            <div class="input-box">
              <label for="firstname">Primeiro Nome</label>
              <input
                type="text"
                id="firstname"
                name="firstname"
                placeholder="Digite seu primeiro nome"
                required
              />
            </div>

            <div class="input-box">
              <label for="lastname">Sobrenome</label>
              <input
                type="text"
                id="lastname"
                name="lastname"
                placeholder="Digite seu segundo nome"
                required
              />
            </div>

            <div class="input-box">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="input-box">
              <label for="number">Celular</label>
              <input
                type="tel"
                id="number"
                name="number"
                placeholder="(xx) xxxx-xxxx"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua senha"
                required
              />
            </div>

            <div class="input-box">
              <label for="confirmpassword">Confirmar Senha</label>
              <input
                type="password"
                id="confirmpassword"
                name="confirmpassword"
                placeholder="Confirme sua senha"
                required
              />
            </div>
          </div>

          <div class="continue-button">
            <button type="button" id="continue">Continuar</button>
          </div>

          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>
