<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/style_cadastro_empresa.css">
    <title>Cadastro de empresa</title>
</head>

<header class="header"></header>

<body>
    <div class="container">
        <div class="sidebar">

            <div></div>

            <img class="logo" src="../Logotipo_TS_2.png" alt="">
 
            <div class="page">
                <span>Página 1 de 2</span>
                <a href="cadastro_empresa_pdois.html">Próxima Página</a>
            </div>
        </div>

        <div class="line"></div>

        <div class="main_content">
            <h2 class="title">Cadastro de Empresa</h2>

            <div class="div_form">
                <div class="form_header">
                    <div class="code">
                        <span>Código</span>
                        <span class="code_text" id="codigo_value">0</span>
                    </div>

                    <div class="att_date">
                        <span>Data de atualização</span>
                        <span class="att_date_text" id="data_atualizacao_value">23/10/2022</span>
                    </div>

                </div>

                <!-- OK -->

                <div class="form_lines">
                    <input type="text" class="large_field" id="inp_fantasy_name" placeholder="Nome Fantasia">
                    <input type="text" class="medium_large_field" placeholder="Razão social">
                </div>

                
                <div class="form_lines">

                    <input type="number" class="medium_field" name="" id="inp_cnpj" placeholder="CNPJ">
                    <input type="text" class="medium_field" name="" id="inp_es" placeholder="Inscrição Estadual">
                    <input type="number" class="medium_large_field" name="" id="inp_contact" placeholder="Telefone de contato">

                </div>

                <div class="form_lines">

                    <input type="text" class="large_field" name="" id="inp_address" placeholder="Endereço">
                    <input type="number" class="small_field" name="" id="inp_number" placeholder="Número">
                    <input type="text" class="complement" name="" id="inp_complement" placeholder="Complemento">

                </div>

                <div class="form_lines">
                    <input type="text" class="medium_field" name="" id="inp_neighbor" placeholder="Bairro">
                    <input type="text" class="medium_field" name="" id="inp_cep" placeholder="CEP">
                    <input type="text" class="small_field" name="" id="inp_uf" placeholder="UF">
                    <input type="text" class="city" name="" id="inp_city" placeholder="Cidade">
                </div>

                <div class="form_lines">
                    <input type="text" class="large_field" name="" id="inp_contact-name" placeholder="Nome do contato">
                </div>

                <div class="form_lines">
                    <input type="text" class="large_field" name="" id="inp_email" placeholder="Email do contato">
                </div>

            </div>

        </div>
    </div>
    <div class="div_content_btns">
        <div class="btns">
            <button class="save">Salvar</button>
            <button class="cancel">Cancelar</button>
        </div>
        
    </div>
</body>
</html>
