<!DOCTYPE html>
<html lang="pt-br" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Acidentes</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
</head>

<body>
    <div class="navbar">
        <div class="barra-fundo"></div>
        <div class="text">Registrar Acidente</div>
        <img class="voltar-house" src="voltar-house0.svg" />
    </div>
    <div class="container">
        <div class="title">Registro Acidentes</div>
        <div class="content">
            <form action="#">
                <div class="questions">
                    <div class="input-box">
                        <span class="details">Data do Incidente:</span>
                        <input type="text" placeholder="DD/MM/AAA" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Local do Acidente:</span>
                        <input type="text" placeholder="Digite o local" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Matrícula do funcionário afetado:</span>
                        <input type="text" placeholder="Digite a matrícula" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Digite de forma coerente a fratura tida pelo funcionário:</span>
                        <input type="text" placeholder="Digite a fratura" required>
                    </div>
                    <div class="input-box">
                        <span class="details">Digite uma descrição detalhada do ocorrido:</span>
                        <textarea placeholder="Descrição do ocorrido" required></textarea>
                    </div>
                </div>
                <div class="all-options">
                    <input type="radio" name="option" id="dot-1">
                    <input type="radio" name="option" id="dot-2">
                    <input type="radio" name="option" id="dot-3">
                    <span class="option-title">O funcionário estava utilizando EPI ?</span>
                    <div class="category">
                        <label for="dot-1">
                            <span class="dot one"></span>
                            <span class="option">Sim</span>
                        </label>
                        <label for="dot-2">
                            <span class="dot two"></span>
                            <span class="option">Não</span>
                        </label>
                    </div>
                </div>
                <div class="button">
                    <input type="submit" value="Registrar">
                </div>
            </form>
        </div>
    </div>
</body>

</html>
