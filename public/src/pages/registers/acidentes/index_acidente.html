<!DOCTYPE html>
<html lang="pt-br" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro Acidentes</title>
    <link
      rel="stylesheet"
      href="/public/src/pages/registers/acidentes/styles.css"
    />
  </head>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link
    rel="icon"
    href="/public/src/assets/icons/card-text.svg"
    type="image/svg+xml"
  />

  <body>
    <div class="navbar">
      <div class="barra-fundo"></div>
      <div class="text">Registrar Acidente</div>
      <a href="/public/src/pages/option/index_option.html">
        <img class="voltar-house" src="/public/src/assets/icons/house.svg" />
      </a>
    </div>
    <div class="container">
      <div class="title">Formulário - Acidente</div>
      <div class="content">
        <form action="#">
          <div class="questions">
            <div class="input-box">
              <span class="details">Data do Acidente:</span>
              <input type="text" placeholder="DD/MM/AAAA" required />
            </div>
            <!-- ADD CLASS IN INPUTS CRUD / APLICAR REQUERIMENTO PARA SCRIPT (NOMEAÇÃO)-->
            <div class="input-box">
              <span class="details">Local do Acidente:</span>
              <input
                class="register"
                type="text"
                placeholder="Digite o local"
                required
              />
            </div>
            <div class="input-box">
              <span class="details">Matrícula do funcionário afetado:</span>
              <input type="text" placeholder="Digite a matrícula" required />
            </div>
            <div class="input-option">
                <span class="details">Turno do trabalho:</span>
                <div class="radio-group">
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">Matutino</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">Vespertino</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">Noturno</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">ADM</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">Serviço Diurno</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="turno" />
                        <span class="radio-label">SN</span>
                    </label>
                </div>
                
                <span class="details periodo-title">Período:</span>
                <div class="radio-group periodo-group">
                    <label class="radio-option">
                        <input type="radio" name="periodo" />
                        <span class="radio-label">Normal</span>
                    </label>
                    <label class="radio-option">
                        <input type="radio" name="periodo" />
                        <span class="radio-label">Extra</span>
                    </label>
                </div>
            </div>

            <!-- APLICAR A CAT - AFASTAMENTO - QUAL EPI - E QUANTIA DE ACIDENTES -->

            <div class="input-box">
              <span class="details"
                >Digite de forma coerente a fratura tida pelo funcionário:</span
              >
              <input type="text" placeholder="Digite a fratura" required />
            </div>
            <div class="input-box">
              <span class="details"
                >Digite uma descrição detalhada do ocorrido:</span
              >
              <textarea placeholder="Descrição do ocorrido" required></textarea>
            </div>
          </div>
          <div class="all-options">
            <span class="option-title"
              >O funcionário estava utilizando EPI?</span
            >
            <div class="category">
              <label for="dot-1">
                <input type="radio" id="dot-1" name="epi" hidden />
                <span class="dot one"></span>
                <span class="option">Sim</span>
              </label>
              <label for="dot-2">
                <input type="radio" id="dot-2" name="epi" hidden />
                <span class="dot two"></span>
                <span class="option">Não</span>
              </label>
            </div>
          </div>
          <div class="button">
            <input type="submit" value="Registrar" />
          </div>
        </form>
      </div>
    </div>
  </body>
  <script src="/public/src/services/script_acidente.js"></script>
</html>
