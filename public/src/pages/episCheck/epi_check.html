<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="/public/src/assets/imgs/Logotipo_TS.png" sizes="64x64">

    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style_epis.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/js/all.min.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="top-border">
        <a href="/public/src/pages/screenCheck/index_check.html" class="back-icon">
            <i class="fas fa-arrow-left back-arrow"></i>
        </a>
        <span class="title">EPIS</span>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>ID</th>
                    <th>Validade</th>
                </tr>
            </thead>
            <tbody>
              
            </tbody>
        </table>

        <button class="add-item">Adicionar</button>

        <!-- Formulário -->
        <div id="item-form" style="display: none;">
            <div class="form-container">
                <input type="text" id="item-name" placeholder="Nome do item">
                <input type="text" id="item-id" placeholder="ID">
                <input type="date" id="item-date">
                <button id="save-item">Salvar</button>
            </div>
        </div>
    </div>

    <script src="/public/src/services/script_epi.js"></script>
</body>
</html>
