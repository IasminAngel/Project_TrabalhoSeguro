<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <link rel="stylesheet" href="/public/src/pages/profile_funcionario/style_employee.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>

<div class="profile-container">
    <!-- Imagem de Perfil -->
    <div class="profile-img-container">
        <img id="profile-img" src="/public/src/assets/imgs/Personicone.png" alt="Imagem de Perfil" class="profile-img">
        <input type="file" id="image-input" class="image-input" accept="image/*">
    </div>

    <!-- Informações do Usuário -->
    <div class="user-info">

        <div class="info-item">
            <label><i class="fas fa-user"></i> Nome:</label>
            <span id="nome-text"></span>
            <input type="text" id="nome-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-user-tag"></i> Sobrenome:</label>
            <span id="sobrenome-text"></span>
            <input type="text" id="sobrenome-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-envelope"></i> Email:</label>
            <span id="email-text"></span>
            <input type="email" id="email-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-phone"></i> Telefone:</label>
            <span id="telefone-text"></span>
            <input type="text" id="telefone-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-map-marker-alt"></i> Endereço:</label>
            <span id="endereco-text"></span>
            <input type="text" id="endereco-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-map-pin"></i> CEP:</label>
            <span id="cep-text"></span>
            <input type="text" id="cep-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-city"></i> Cidade:</label>
            <span id="cidade-text"></span>
            <input type="text" id="cidade-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-flag"></i> Estado:</label>
            <span id="estado-text"></span>
            <input type="text" id="estado-input" class="edit-field">
        </div>

        <div class="info-item">
            <label><i class="fas fa-home"></i> Número:</label>
            <span id="numero-text"></span>
            <input type="text" id="numero-input" class="edit-field">
        </div>

    </div>

    <!-- Botões -->
    <div class="buttons-container">
        <button class="button edit-btn" id="edit-button">
            <i class="fas fa-edit"></i> Editar Perfil
        </button>
        <button class="button save-btn" id="save-button" style="display: none;">
            <i class="fas fa-save"></i> Salvar
        </button>
        <a href="/public/src/pages/option/index_option.html" class="button logout-btn">
            <i class="fas fa-sign-out-alt"></i> Sair
        </a>
    </div>
</div>

<script src="/public/src/services/script_employee.js"></script>
</body>
</html>
