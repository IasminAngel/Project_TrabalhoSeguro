<!DOCTYPE html>
<html lang="pt-br" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Acidentes</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/src/pages/registers/style_register.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #11185E, #254AA3);
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #11185E;
            position: relative;
            display: inline-block;
        }

        .title::after {
            content: "";
            width: 50px;
            height: 4px;
            background: #254AA3;
            display: block;
            margin: 10px auto 0;
            border-radius: 2px;
        }

        form {
            text-align: left;
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box span {
            display: block;
            font-weight: 500;
            margin-bottom: 5px;
            color: #333;
        }

        .input-box input, .input-box textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-box input:focus, .input-box textarea:focus {
            border-color: #2378B9;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .category {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            gap: 20px;
        }

        .category label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .dot {
            width: 18px;
            height: 18px;
            border: 2px solid #ccc;
            border-radius: 50%;
            display: inline-block;
            transition: background 0.3s ease;
        }

        input[type="radio"]:checked + .dot {
            background: #11185E;
            border-color: #11185E;
        }

        .button input {
            width: 100%;
            padding: 12px;
            background: #022A6A;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .button input:hover {
            background: #87B7FF;
        }

        @media(max-width: 768px) {
            .category {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="title">Registro de Acidentes</div>
        <form>
            <div class="input-box">
                <span>Data do Incidente:</span>
                <input type="text" placeholder="DD/MM/AAAA" required>
            </div>
            <div class="input-box">
                <span>Local do Acidente:</span>
                <input type="text" placeholder="Digite o local" required>
            </div>
            <div class="input-box">
                <span>Matrícula do Funcionário:</span>
                <input type="text" placeholder="Digite a matrícula" required>
            </div>
            <div class="input-box">
                <span>Descrição do Ocorrido:</span>
                <textarea placeholder="Descreva o ocorrido" required></textarea>
            </div>
            <div class="category">
                <label>
                    <input type="radio" name="epi" required>
                    <span class="dot"></span>
                    Sim
                </label>
                <label>
                    <input type="radio" name="epi" required>
                    <span class="dot"></span>
                    Não
                </label>
            </div>
            <div class="button">
                <input type="submit" value="Registrar">
            </div>
        </form>
    </div>
</body>

</html>
