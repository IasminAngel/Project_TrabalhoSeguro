<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/Style.css">
    <title>Inscrição</title>

</head>
<body>
    <nav class="navBar">

    </nav>

    <div class="divContent">

    
    <div class="sideBar">

        <figcaption class="logotypeGroup">
            <p>AQUI VAI O LOGOTIPO</p>
        </figcaption>

        <div class="decorationDiv" id="firstRec"></div>
        <div class="decorationDiv" id="secondRec"></div>
        <div class="decorationDiv" id="thirdRec"></div>
        <div class="decorationDiv" id="fourthRec"></div>
        <div class="decorationDiv" id="fifthRec"></div>
        <div class="decorationDiv" id="sixthRec"></div>
        <div class="decorationDiv" id="seventhRec"></div>
    </div>

    <div class="divContentMain">
        <h1 id="title">Cadastro de empresa</h1>
    
        <div class="registrationArea">
            <div class="registrationRows">

                <div class="below" id="codeDiv">
                        <h3>Código</h3>
                        <p id="code">0</p>
                    </div>
    
                    
                    <div class="below">
                        <h3>Data de atualização</h3>
                        <p id="updateDate">25/10/2022</p>
                    </div>
            </div>
            
            <div class="registrationRows">
                <div class="below">
                    <p>Nome Fantasia</p>
                    <input type="text" id="fantasyName">
                </div>
                <div class="below">
                    <p>Razão Social</p>
                    <input type="text" id="socialReason">
                </div>
            </div>


            <div class="registrationRows">
                <div class="below">
                    <p>CNPJ</p>
                    <input type="text">
                </div>

                <div class="below">
                    <p>Inscrição estadual</p>
                    <input type="text">
                </div>

                <div class="below">
                    <p>Telefone de contato</p>
                    <input type="text">
                </div>
            </div>

            <div class="registrationRows"></div>

            <div class="below">
                <p>Endereço</p>
                <input type="text">
            </div>

            <div class="below" id="numberDiv">
                <p>Número</p>
                <input type="text">
            </div>

            <div class="below">
                <p>Complemento</p>
                <input type="text">
            </div>

            <div class="registrationRows">
                <div class="below">
                    <p>Bairro</p>
                    <input type="text">
                </div>

                <div class="below">
                    <p>CEP</p>
                    <input type="text">
                </div>

                <div class="below">
                    <p>UF</p>
                    <input type="text">
                </div>

                <div class="below">
                    <p>Cidade</p>
                    <input type="text">
                </div>
            </div>
            
            <div class="registrationRows">
                <div class="below">
                    <p>Nome do contato</p>
                    <input type="text">
                </div>
            </div>

            <div class="registrationRows">
                <div class="below">
                    <p>Email de contato</p>
                    <input type="text">
                </div>
            </div>
        </div>
        
        <a href="#" id="save">Salvar</a>
        <a href="#" id="exit">Cancelar</a>
    </div>

</div>
    
</body>
</html>
