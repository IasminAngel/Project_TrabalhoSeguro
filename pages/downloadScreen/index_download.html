<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Baixar Relatórios</title>
    <link rel="stylesheet" href="/assets/css/style_download.css" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/assets/imgs/Logotipo_TS.png" sizes="64x64"/>
    <style>
   
      .dashboard-link {
        position: fixed;
        top: 10px;
        right: 10px;
        color: white;
        background-color: #3c4ba1;
        padding: 8px 12px;
        font-weight: bold;
        text-decoration: none;
        border-radius: 4px;
        font-family: Arial, sans-serif;
        z-index: 1000;
        transition: background-color 0.3s ease;
      }
      .dashboard-link:hover {
        background-color: #6d6fbe;
      }
    </style>
</head>
<body>

    
    <a href="http://localhost:8501" target="_blank" class="dashboard-link">Dashboard</a>

    <a href="/aplicacao">
        <button class="close-btn right">
            <i class="fas fa-times"></i>
        </button>
    </a>
    
    <div class="menu-container">
        <div class="content">
            <h2>Deseja baixar os relatórios de quais registros?</h2>
            <div class="buttons-container">
                <button class="report-btn" onclick="downloadRelatorio('acidente')">Acidente</button>
                <button class="report-btn" onclick="downloadRelatorio('incidente')">Incidente</button>
                <button class="report-btn" onclick="downloadRelatorio('desvio')">Desvio</button>
                <button class="report-btn" onclick="downloadRelatorio('tudo')">Tudo</button>
            </div>
        </div>
    </div>

    <script>
        function downloadRelatorio(tipo) {
            let relatorio = "";
            if (tipo === 'acidente') {
                relatorio = "ID, Tipo, Descrição\n1, Acidente, Queda na escada";
            } else if (tipo === 'incidente') {
                relatorio = "ID, Tipo, Descrição\n2, Incidente, Derramamento de óleo";
            } else if (tipo === 'desvio') {
                relatorio = "ID, Tipo, Descrição\n3, Desvio, Uso incorreto de EPIs";
            } else {
                relatorio = "ID, Tipo, Descrição\n1, Acidente, Queda na escada\n2, Incidente, Derramamento de óleo\n3, Desvio, Uso incorreto de EPIs";
            }
            const blob = new Blob([relatorio], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `relatorio_${tipo}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
