<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/esqueceu_senha/src/assents/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      rel="icon"
      href="/esqueceu_senha/src/assents/img/question.svg"
      type="image/svg+xml"
    />
    <title>Esqueceu a senha</title>
  </head>
  <body>
    <div class="container">
      <div class="form-image">
        <img
          src="/esqueceu_senha/src/assents/img/password.svg"
          alt="Password image"
        />
      </div>
      <div class="form">
        <form action="#">
          <div class="form-header">
            <div class="title">
              <h1>Esqueceu a Senha</h1>
            </div>
            <div class="login-button">
              <button><a href="/tela_login/index.html">Inicio</a></button>
            </div>
          </div>

          <div class="input-group">
            <div class="input-box">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Nova Senha</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Digite sua nova senha"
                required
              />
            </div>

            <div class="input-box">
              <label for="password">Confirmar Senha</label>
              <input
                type="password"
                id="confirmPassword"
                name="password"
                placeholder="Confirme sua nova senha"
                required
              />
            </div>
          </div>

          <div class="continue-button">
            <button><a href="#" id="confirm">Confirmar</a></button>
          </div>
          <div id="error-message" style="color: red; display: none"></div>
        </form>
      </div>
    </div>
    <script src="/esqueceu_senha/src/script.js"></script>
  </body>
</html>
